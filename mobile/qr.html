<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saverly Expo Go QR Code</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fbfa;
      color: #1a202c;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #1C9A76;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #718096;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 20px;
    }
    img {
      display: block;
      width: 280px;
      height: 280px;
    }
    .url {
      background: #edf2f7;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      color: #2d3748;
      user-select: all;
    }
    .tip {
      margin-top: 16px;
      font-size: 12px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scan to Open in Expo Go</h1>
    <p>Point your iPhone Camera at this QR code</p>
    
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=exp%3A%2F%2F192.168.1.145%3A8081" alt="Expo Go QR Code" />
    </div>

    <p style="margin-bottom: 8px; font-weight: 600;">Or open Safari on iPhone and type:</p>
    <div class="url">exp://192.168.1.145:8081</div>
    <div class="tip">Connected to live API: https://apisaverly.cyberneticde.site/api</div>
  </div>
</body>
</html>
